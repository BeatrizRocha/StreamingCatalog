name: CI - Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: streaming_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: catalog-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: catalog-api

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: catalog-api
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/streaming_catalog_test?schema=public"

      - name: Run unit tests
        run: npm run test
        working-directory: catalog-api

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: catalog-api
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/streaming_catalog_test?schema=public"
          JWT_SECRET: "test-secret-key-123"
          JWT_EXPIRES_IN: "1d"
          PORT: 3001
          TMDB_ACCESS_TOKEN: "fake-ci-token-for-joi-validation"
