version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: streaming_catalog_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: streaming_catalog
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: streaming_catalog_cache
    restart: always
    ports:
      - '6380:6379'

volumes:
  postgres_data:
